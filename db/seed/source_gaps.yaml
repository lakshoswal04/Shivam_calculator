# Sources V1 needs but does not have. Surfaced in every affected assessment
# so a gap is visible rather than silently producing a thin answer.
#
# A gap is closed with `resolved_on`, never by deletion: the record of what was
# once missing is part of the audit trail.
gaps:
  - code: COMPANIES_ACT_2013
    severity: BLOCKER
    title: "Companies Act, 2013 in the corpus is amended only to 29-05-2015"
    detail: >-
      The Companies Act, 2013 is now in the source corpus, consolidated to 29-05-2015, and
      sections 23, 39, 55, 62, 63, 117 and 179(3)(c) are cited from it. Section 42 is the
      exception: the text held is the pre-2018 version, which was wholly substituted by the
      Companies (Amendment) Act, 2017 with effect from 07-08-2018. Conclusions that depend on
      the current section 42 therefore cannot be produced.
    action_required: >-
      Supply the Companies Act, 2013 as amended to date, carrying section 42 as substituted
      with effect from 07-08-2018, into corpus/originals/ with a .meta.json sidecar declaring
      its as_amended_upto date, and re-run ./run_pipeline.sh. Until then no rule may be
      approved from section 42, and every section sourced from this edition should be checked
      for amendment after 29-05-2015 before approval.
    blocks_issue_types: [PRIVATE_PLACEMENT]
    provisions_required: ["42"]

  - code: PUBLIC_ISSUE_ICDR_CH2
    severity: BLOCKER
    title: "No rule has been authored for an initial public offer"
    detail: >-
      An initial public offer is governed by Chapter II of the SEBI ICDR Regulations -
      eligibility, minimum promoter contribution, lock-in, minimum offer to the public - with
      the prospectus provisions of the Companies Act, 2013. Chapter II is in the corpus and
      readable in the legal library, but no rule has been authored from it, and several of its
      requirements rest on SEBI circulars that have not been authored either. The route runs
      every calculation; its legal conclusions are withheld.
    action_required: >-
      Author the Chapter II rule set (regulations 5 to 7 eligibility, 14 to 16 promoter
      contribution and lock-in, 236 and 238 minimum offer and allocation) against the ICDR
      Regulations already in corpus/originals/, and supply the SEBI circulars the allocation
      and anchor-investor requirements depend on.
    blocks_issue_types: [PUBLIC_ISSUE]
    provisions_required: ["5", "6", "7", "14", "15", "16", "236", "238"]

  - code: MCA_FORM_INSTRUCTION_KITS
    severity: GAP
    title: "The MCA instruction kit for PAS-3 is absent"
    detail: >-
      The instruction kits for MGT-14 and SH-7 are now in the corpus. PAS-3 (return of
      allotment) is still missing, so its field-level filing requirements cannot be stated.
    action_required: "Supply the MCA instruction kit for PAS-3."
    blocks_issue_types: []
    provisions_required: []

  - code: SEBI_CIRCULARS
    severity: GAP
    title: "SEBI circulars and master circulars are absent"
    detail: >-
      Operational clarifications issued under the ICDR and LODR Regulations are not in the
      corpus, so requirements that rest on them cannot be authored.
    action_required: "Supply the relevant SEBI circulars and master circulars."
    blocks_issue_types: []
    provisions_required: []
    # Closed by the ICDR master circular (last updated 09-02-2026) and the LODR
    # master circular (last updated 30-01-2026), both now in corpus/originals/.
    resolved_on: 2026-09-15

  - code: NSE_CML_2023_51
    severity: GAP
    title: "NSE circular NSE/CML/2023/51 is absent"
    detail: >-
      Cited by the NSE 'Points to remember' guidance as gating the issue-summary requirement
      for preferential issues above Rs 100 crore, but the circular itself was not supplied.
    action_required: "Supply NSE circular NSE/CML/2023/51 dated 05 July 2023."
    blocks_issue_types: []
    provisions_required: []
